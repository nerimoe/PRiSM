name: checks
on:
  pull_request:
  push:
    branches: [main, fix/scan-latency-request-amplification]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run check:platform
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: npm install --prefix "$RUNNER_TEMP/prism-browser" playwright@1.62.1
      - run: node "$RUNNER_TEMP/prism-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Check scan first paint and polling
        env:
          PRISM_PLAYWRIGHT_MODULE: ${{ runner.temp }}/prism-browser/node_modules/playwright
          PRISM_SCAN_OUTPUT: .scan-check
        run: |
          (cd packages/prism-web && ../../node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-scan-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-first-paint
          path: .scan-check/*.png
