[package]
name = "prism-launcher"
version = "0.2.0"
edition = "2024"
description = "Headless Windows host node client for PRiSM Next"

[[bin]]
name = "prism-launcher"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
base64 = "0.22.1"
env_logger = { version = "0.11.8", default-features = false }
futures-util = "0.3.31"
hex = "0.4.3"
jpeg-encoder = "0.6.1"
log = "0.4.28"
reqwest = { version = "0.13.1", default-features = false, features = ["native-tls-no-alpn"] }
reqwest-websocket = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.56.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
